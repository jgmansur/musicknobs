name: Daily Copyright News Update

on:
  schedule:
    # 07:10 y 19:10 UTC (≈ 01:10 y 13:10 hora de CDMX)
    # Los minutos "raros" son a propósito: en punto de hora es cuando GitHub
    # tiene más carga y los jobs programados se retrasan o se pierden.
    - cron: '10 7,19 * * *'
  workflow_dispatch:

# Si un run tarda, que no se encimen dos escribiendo el mismo data.json
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # El script no usa dependencias npm: solo fetch nativo de Node.
      # Antes se instalaban groq-sdk y node-fetch en cada corrida.
      - name: Fetch verified news
        working-directory: .github/scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node fetch_news.js

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias/data.json noticias/archivo
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "chore(noticias): actualización diaria verificada"
            git push
          fi

  deploy:
    needs: update-news
    uses: ./.github/workflows/deploy_pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
