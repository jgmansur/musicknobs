name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}
  workflow_call: {} # Allows calling from update_news.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PAGE_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # El Finance Dashboard NO se publica aquí: vive en Vercel
      # (finance-dashboard-mocha-rho.vercel.app) y esa es la única versión buena.
      # Antes se construía y publicaba también en Pages, así que había dos
      # despliegues del mismo commit y verificar un cambio en el equivocado
      # llevaba a conclusiones falsas. Se excluye del artefacto porque el upload
      # toma el repo entero (path: '.') y si no, se serviría el código fuente.
      - name: Exclude finance dashboard from Pages
        run: rm -rf finance-dashboard
      - name: Build casa galeria portfolio
        run: npm ci --prefix casa-galeria-portfolio && npm run build --prefix casa-galeria-portfolio
      - name: Prepare casa galeria portfolio deploy files
        run: rm -rf casa-galeria-portfolio/assets && cp -r casa-galeria-portfolio/dist/* casa-galeria-portfolio/ && cp casa-galeria-portfolio/dist/.nojekyll casa-galeria-portfolio/ || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGE_ARTIFACT_NAME }}
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGE_ARTIFACT_NAME }}
