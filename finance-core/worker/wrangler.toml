name = "finance-core"
main = "src/index.js"
compatibility_date = "2025-01-15"

# postgres.js abre un socket TCP contra el pooler de Supabase, y para eso
# necesita las APIs de Node.
compatibility_flags = ["nodejs_compat"]

# La API queda en workers.dev pero exige token. Las URLs de preview se apagan:
# generan endpoints extra por cada versión y aquí no hacen falta.
# Ojo: van al nivel raíz. Debajo de [observability] quedan dentro de esa tabla
# y wrangler los ignora en silencio.
workers_dev = true
preview_urls = false

[vars]
FINANCE_ALLOWED_EMAILS = "jgmansur2@gmail.com"
# Cliente OAuth del dashboard (proyecto «Jay App»): solo sus tokens de Google
# entran por x-google-token, no los de cualquier otra app.
GOOGLE_CLIENT_IDS = "427918095213-6cbm5sgcfn6o8qosg6qe1r6u9toj66dp.apps.googleusercontent.com"

[observability]
enabled = true

# Cada 15 minutos. Las alertas del banco llegan en segundos, así que este
# retraso es el techo de cuánto tarda un gasto en aparecer en la bandeja.
[triggers]
crons = ["*/15 * * * *"]

# Secretos (nunca en este archivo — se cargan con `wrangler secret put`):
#   SUPABASE_DB_URL
#   GMAIL_CLIENT_ID
#   GMAIL_CLIENT_SECRET
#   GMAIL_REFRESH_TOKEN
#   API_TOKEN
#   SESSION_SECRET  (firma las sesiones del dashboard; rotarlo las cierra todas)
